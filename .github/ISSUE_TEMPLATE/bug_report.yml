name: Bug Report
description: Create a report to help us improve AGY CLI Dashboard
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting an issue! Please describe the problem in detail.
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run start.cmd
        2. Click on...
        3. See unexpected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: System Environment
      placeholder: Windows 11 (24H2), .NET 10 SDK, Antigravity CLI v1.3.1
