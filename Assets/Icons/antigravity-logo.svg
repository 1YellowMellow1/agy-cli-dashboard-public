<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
  <defs>
    <linearGradient id="infinityGlow" x1="2" y1="6" x2="22" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="titaniumBack" x1="2" y1="6" x2="22" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Anti-Gravity Levitation Base -->
  <ellipse cx="12" cy="20.8" rx="4.5" ry="1" fill="#38BDF8" opacity="0.25"/>
  <path d="M 5 21.6 C 8.5 20.2 15.5 20.2 19 21.6" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

  <!-- 3D Titanium Infinity Loop Backing -->
  <path d="M 6.5 7.5 C 3.5 7.5 1.5 9.5 1.5 12 C 1.5 14.5 3.5 16.5 6.5 16.5 C 9.5 16.5 11 13.5 12 12 C 13 10.5 14.5 7.5 17.5 7.5 C 20.5 7.5 22.5 9.5 22.5 12 C 22.5 14.5 20.5 16.5 17.5 16.5 C 14.5 16.5 13 13.5 12 12 C 11 10.5 9.5 7.5 6.5 7.5 Z" stroke="url(#titaniumBack)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glowing Cyan Core Möbius Lightguide -->
  <path d="M 6.5 7.5 C 3.5 7.5 1.5 9.5 1.5 12 C 1.5 14.5 3.5 16.5 6.5 16.5 C 9.5 16.5 11 13.5 12 12 C 13 10.5 14.5 7.5 17.5 7.5 C 20.5 7.5 22.5 9.5 22.5 12 C 22.5 14.5 20.5 16.5 17.5 16.5 C 14.5 16.5 13 13.5 12 12 C 11 10.5 9.5 7.5 6.5 7.5 Z" stroke="url(#infinityGlow)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonBlur)"/>

  <!-- Inner Spark / Quantum Core Highlight -->
  <circle cx="12" cy="12" r="1.4" fill="#E0F2FE" opacity="0.9"/>
  <circle cx="12" cy="12" r="2.8" fill="#38BDF8" opacity="0.35"/>
</svg>
